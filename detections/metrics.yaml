# Machine-readable per-detection metrics.
# truePositivesObserved refers to historical lab incidents.
# estimatedDetectionLatencyMinutes uses the rule interval plus ingestion lag.
# It is an estimate, not a measured mean time to detect.
# observedFalsePositiveRate: a single-tenant environment cannot produce a meaningful FP RATE
# (N is tiny; "0%" at N=1 is absence of data, not a measurement). Each rule states the
# honest position plus how FP would actually be measured in production: the share of
# that rule's incidents closed as benign over a rolling 30 days, driven down by tuning
# (allow-list watchlists, thresholds). Where a benign baseline volume is knowable it is
# given instead.
# The historical batch (validation/RESULTS.md) reports 5/5 expected signals and
# 0 false fires on the benign cases it ran. The DET-009 result used the previous watchlist.

DET-001:
  name: Failed Activity Log operations spike
  expectedEventVolumePerDay: "<1 (admin-plane failures are rare outside probing)"
  observedFalsePositiveRate: "not measurable at single-tenant scale; in prod = share of these incidents closed-as-benign over 30d. Benign baseline here: 0 callers crossed >=8 failures/5m outside the simulation"
  truePositivesObserved: 1          # incident #4
  ruleIntervalMinutes: 15
  estimatedDetectionLatencyMinutes: 18

DET-002:
  name: Network Security Group rule modified
  expectedEventVolumePerDay: "0-2 (NSG changes are infrequent in a small env)"
  observedFalsePositiveRate: "not measurable at single-tenant scale; in prod = share of these incidents closed-as-benign over 30d, driven down by the soc-nsg-change-principals allow-list"
  truePositivesObserved: 1          # incident #5
  ruleIntervalMinutes: 30
  estimatedDetectionLatencyMinutes: 33

DET-003:
