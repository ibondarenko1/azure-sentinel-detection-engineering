  expectedEventVolumePerDay: "~0 (LSASS access outside the Defender stack is exceptional)"
  observedFalsePositiveRate: "not measurable at single-tenant scale; in prod = share of these incidents closed-as-benign over 30d. Here only the authorised validation attempts fired"
  truePositivesObserved: 1          # incident #65 (controlled T1003.001 attempt, prevented)
  ruleIntervalMinutes: 15
  estimatedDetectionLatencyMinutes: 18

DET-007:
  name: Privilege grant followed by deployment (same principal)
  dataPlane: "AzureActivity self-join (roleAssignments/write -> watched-provider write, same Caller, <=30m)"
  expectedEventVolumePerDay: "~0 (the correlation is rare; either half alone does not fire)"
  observedFalsePositiveRate: "not measurable at single-tenant scale; in prod = share of these incidents closed-as-benign over 30d. Lower than either single-stage rule by construction (requires both steps)"
  truePositivesObserved: 1          # live witness: grant 07:54 -> deploy 08:02 by same principal correlated
  ruleIntervalMinutes: 30
  estimatedDetectionLatencyMinutes: 33

DET-008:
