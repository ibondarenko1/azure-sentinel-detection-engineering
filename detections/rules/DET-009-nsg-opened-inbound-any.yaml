id: 9c3f4e5a-6d7b-48c9-a0e1-2f3a4b5c6d7e
name: "[DET] NSG security-rule change on a rule open inbound from Any"
description: |
  Content-level companion to DET-002. DET-002 fires on any NSG securityRules change by a
  non-automation principal but cannot read the rule body. This rule correlates a successful
  AzureActivity child-rule write with the current Azure Resource Graph posture snapshot in the
  additive soc-open-mgmt-nsg-rule-ids watchlist. The join key is the normalized full child
  security-rule resource ID, rather than an NSG display name. AzureActivity has no before/after
  rule body and the posture snapshot is refreshed separately, so this is a high-fidelity triage
  signal for a changed rule that is currently open inbound from Any; it does not prove that this
  write caused the exposure.
severity: High
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
      - AzureActivity
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1686.001
query: |
  // soc-open-mgmt-nsg-rule-ids: refreshed by the manual main-branch nsg-posture-watchlist Action.
  // The additive ID-keyed alias avoids same-name NSG collisions.
  // SearchKey = normalized full child security-rule resource ID currently open inbound from Any.
  let openRuleIds = _GetWatchlist('soc-open-mgmt-nsg-rule-ids')
    | extend SecurityRuleResourceId = tolower(replace_regex(tostring(SearchKey), @"/+$", ""))
    | where isnotempty(SecurityRuleResourceId)
    | project SecurityRuleResourceId;
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where OperationNameValue has "Microsoft.Network/networkSecurityGroups/securityRules"
  | where OperationNameValue endswith "/write"
  | where ActivityStatusValue == "Success"
  | extend SecurityRuleResourceId = tolower(replace_regex(tostring(ResourceId), @"/+$", ""))
  | where SecurityRuleResourceId contains "/networksecuritygroups/"
  | where SecurityRuleResourceId contains "/securityrules/"
  | where SecurityRuleResourceId in (openRuleIds)
  | extend NsgName = tostring(split(SecurityRuleResourceId, "/")[8])
  | extend CallerIp = tostring(parse_json(tostring(Properties_d.httpRequest)).clientIpAddress)
  | project TimeGenerated, Caller, CallerIp, NsgName, SecurityRuleResourceId,
            OperationNameValue, ResourceId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIp
metadata:
  atomic: "T1686.001, Cloud Firewall. Successful child-rule write matched to a current inbound Allow-from-Any posture row."
  requiredFields: [AzureActivity.OperationNameValue, AzureActivity.ActivityStatusValue, AzureActivity.Caller, AzureActivity.ResourceId, AzureActivity.Properties_d]
  dataPlane: "AzureActivity child-rule change joined by normalized full resource ID to the Azure Resource Graph snapshot in the additive soc-open-mgmt-nsg-rule-ids watchlist."
  falsePositives:
    - "The write may have closed an already-open rule or changed a field without creating the exposure; AzureActivity does not carry before/after rule content."
    - "A management rule intentionally open to the internet (e.g. a documented jump host); exclude that child rule from the posture query or accept and tune."
  severityRationale: "High triage priority. Unlike DET-002 (any NSG change), this joins only to a child rule currently observed as inbound Allow-from-Any, while explicitly retaining the Activity Log causality limitation."
  responseAction: "Inspect the matched child rule and before/after configuration, confirm whether the write caused or left the exposure, then validate intent and investigate the caller and source IP."
