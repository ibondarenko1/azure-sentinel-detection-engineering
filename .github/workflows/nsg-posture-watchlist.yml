name: nsg-posture-watchlist

# Refreshes the additive soc-open-mgmt-nsg-rule-ids Sentinel watchlist from Azure Resource Graph:
# full child security-rule IDs that currently expose inbound Allow-from-Any. DET-009 joins this
# content to AzureActivity by child resource ID. The Activity Log has no before/after rule body,
# so the rule is a current-posture triage signal and does not claim that the write caused opening.
#
# Manual main-branch dispatch only while the workspace is parked. There is no schedule: with
# Sentinel off the watchlist PUT returns AuthorizationFailed on
# Microsoft.SecurityInsights/watchlists/write. The job is also opt-in through the
# SENTINEL_WATCHLIST_REFRESH_ENABLED repository variable.

on:
  workflow_dispatch:

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.SENTINEL_WATCHLIST_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: sentinel-watchlist-refresh
    environment: sentinel-watchlist
    permissions:
      id-token: write
    env:
      WATCHLIST_ALIAS: soc-open-mgmt-nsg-rule-ids
      SENTINEL_WATCHLIST_CLIENT_ID: ${{ vars.SENTINEL_WATCHLIST_CLIENT_ID }}
      SENTINEL_WATCHLIST_TENANT_ID: ${{ vars.SENTINEL_WATCHLIST_TENANT_ID }}
      SENTINEL_WATCHLIST_SUBSCRIPTION_ID: ${{ vars.SENTINEL_WATCHLIST_SUBSCRIPTION_ID }}
      SENTINEL_WATCHLIST_RESOURCE_GROUP: ${{ vars.SENTINEL_WATCHLIST_RESOURCE_GROUP }}
      SENTINEL_WATCHLIST_WORKSPACE: ${{ vars.SENTINEL_WATCHLIST_WORKSPACE }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.SENTINEL_WATCHLIST_CLIENT_ID }}
          tenant-id: ${{ env.SENTINEL_WATCHLIST_TENANT_ID }}
          subscription-id: ${{ env.SENTINEL_WATCHLIST_SUBSCRIPTION_ID }}
      - name: Query ARG for NSGs open inbound from Any
        run: |
          az extension add --name resource-graph --only-show-errors
          TARGET_SUBSCRIPTION="$SENTINEL_WATCHLIST_SUBSCRIPTION_ID"
          if [[ ! "$TARGET_SUBSCRIPTION" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "SENTINEL_WATCHLIST_SUBSCRIPTION_ID must be a GUID" >&2
            exit 1
          fi
          # --subscriptions is intentional: ARG otherwise searches every subscription visible to
          # the identity, which can create cross-subscription name/ID collisions in the watchlist.
          az graph query --subscriptions "$TARGET_SUBSCRIPTION" --allow-partial-scopes false --first 1000 -q "resources \
            | where type =~ 'microsoft.network/networksecuritygroups' \
            | where subscriptionId =~ '$TARGET_SUBSCRIPTION' \
            | mv-expand rule = properties.securityRules limit 1000 \
            | extend p = rule.properties \
            | where tostring(p.access) =~ 'Allow' and tostring(p.direction) =~ 'Inbound' \
            | where tostring(p.sourceAddressPrefix) in ('*','Internet','0.0.0.0/0') \
            | extend securityRuleResourceId = tolower(strcat(id, '/securityRules/', tostring(rule.name))) \
            | project securityRuleResourceId, nsg = name, ruleName = tostring(rule.name), src = tostring(p.sourceAddressPrefix), ports = tostring(p.destinationPortRange)" \
            -o json > arg.json
          python - <<'PY'
          import csv
          import json

          result = json.load(open("arg.json", encoding="utf-8"))
          rows = result.get("data")
          if not isinstance(rows, list):
              raise SystemExit("ARG response did not contain a data array; refusing to publish")

          # Resource Graph exposes pagination metadata in different CLI versions. Any continuation
          # token or count mismatch means this page is incomplete; fail closed instead of replacing
          # a known-good watchlist with a partial posture snapshot.
          count = result.get("count")
          total = next((result.get(key) for key in ("total_records", "totalRecords")
                        if result.get(key) is not None), None)
          truncated = any(str(result.get(key)).lower() == "true"
                          for key in ("result_truncated", "resultTruncated"))
          skip = next((result.get(key) for key in ("skip_token", "skipToken", "$skipToken")
                       if result.get(key)), None)
          if truncated:
              raise SystemExit("ARG result_truncated=true; refusing partial watchlist")
          if skip:
              raise SystemExit("ARG result is paginated (continuation token present); refusing partial watchlist")
          if total is None:
              raise SystemExit("ARG response omitted total_records; refusing possible truncation")
          if count is not None and int(count) != len(rows):
              raise SystemExit(f"ARG count={count} but received {len(rows)} rows; refusing partial watchlist")
          if total is not None and int(total) > len(rows):
              raise SystemExit(f"ARG total_records={total} but received {len(rows)} rows; refusing partial watchlist")

          with open("watchlist.csv", "w", encoding="utf-8", newline="") as handle:
              writer = csv.writer(handle, lineterminator="\n")
              writer.writerow(["SecurityRuleResourceId", "NsgName", "RuleName", "SourcePrefix", "Ports"])
              for r in rows:
                  writer.writerow([str(r.get(k, "")) for k in
                                   ("securityRuleResourceId", "nsg", "ruleName", "src", "ports")])
              if not rows:
                  writer.writerow(["placeholder-no-open-rules", "", "", "", ""])
          print(f"{len(rows)} open NSG rule(s)")
          PY
      - name: Refresh additive ID-keyed NSG rule watchlist
        run: |
          TARGET_SUBSCRIPTION="$SENTINEL_WATCHLIST_SUBSCRIPTION_ID"
          TARGET_RESOURCE_GROUP="$SENTINEL_WATCHLIST_RESOURCE_GROUP"
          TARGET_WORKSPACE="$SENTINEL_WATCHLIST_WORKSPACE"
          if [[ -z "$TARGET_RESOURCE_GROUP" || -z "$TARGET_WORKSPACE" ]]; then
            echo "SENTINEL_WATCHLIST_RESOURCE_GROUP and SENTINEL_WATCHLIST_WORKSPACE are required" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          raw = open("watchlist.csv", encoding="utf-8").read()
          body = {"properties": {"displayName": "SOC open management NSG rule IDs",
                                 "source": "Local file", "provider": "Custom",
                                 "description": "Full child security-rule resource IDs currently open inbound from Any, scoped to the configured subscription. Additive ID-keyed alias for DET-009; legacy name-keyed alias is retained during migration.",
                                 "itemsSearchKey": "SecurityRuleResourceId", "contentType": "text/csv", "rawContent": raw}}
          json.dump(body, open("body.json", "w", encoding="utf-8"))
          PY
          az rest --method put \
            --url "https://management.azure.com/subscriptions/$TARGET_SUBSCRIPTION/resourceGroups/$TARGET_RESOURCE_GROUP/providers/Microsoft.OperationalInsights/workspaces/$TARGET_WORKSPACE/providers/Microsoft.SecurityInsights/watchlists/$WATCHLIST_ALIAS?api-version=2025-09-01" \
            --headers "Content-Type=application/json" --body @body.json -o none
          echo "watchlist $WATCHLIST_ALIAS refreshed"
