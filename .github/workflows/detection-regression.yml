name: detection-regression

# Proves the deployed rules still fire: trigger atomic-aligned actions, assert
# matching incidents appear, clean up.
#
# Historical lab workflow. Keep disabled until the trigger and cleanup are
# scoped to resources owned by each run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.ref == 'refs/heads/main' && vars.SENTINEL_LAB_REGRESSION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: sentinel-lab-regression
    timeout-minutes: 150
    concurrency:
      group: sentinel-lab-regression
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SENTINEL_RESOURCE_GROUP: sc200-lab
      SENTINEL_WORKSPACE: sc200-ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run detection regression
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: python cicd/regression-test.py
